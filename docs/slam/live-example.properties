# Camera configuration, independent of the MEASURED calibration file.
# One device carrying synchronized left/right frames.
camera.layout=SIDE_BY_SIDE
camera.swapEyes=false
# OpenCV backend: 0=AUTO, 700=DSHOW (Windows), 1400=MSMF (Windows).
camera.backend=0
camera.fps=30
# Use an empty value if MJPG is unsupported.
camera.fourcc=MJPG

map.dense=true
map.disparities=128
map.sampleStep=6
map.maxPointsPerKeyframe=5000
map.minDepth=0.3
map.maxDepth=15
# Dense pose graph: keep small. Reaching capacity stops further map growth.
slam.maxKeyframes=80

view.pixelsPerMetre=45
# DRIVING: heading-aligned schematic perspective. MAP: world X-Z top view.
view.mode=DRIVING
# Probabilistic geometric OCC; no neural network weights required.
occ.enabled=true
occ.resolution=0.25
occ.radius=15
occ.frameInterval=3
occ.maxAgeSeconds=8
occ.maxFrames=20
occ.maxVoxels=200000
occ.minHitFrames=2
occ.hitProbability=0.72
occ.missProbability=0.35
occ.disparitySigma=0.5
occ.minDepthConfidence=0.2
view.cellSize=0.05
# World y points DOWN relative to the FIRST left camera, not ground height.
# For a camera 1.2 m above the floor, floor is around y=+1.2.
# Exclude floor points by keeping maxY below that value.
view.minY=-2
view.maxY=0.8
